<article class="detail {{lang_class}}">
  <p class="index-label"><a href="/veille"><svg class="icon"><use href="#i-sheets"></use></svg><span>Retour à la veille</span></a></p>
  <p class="slip-lang"><span>{{language}}</span></p>
  <h1>{{title_html}}</h1>
  {{meta}}
  <p class="meta">Publié le {{published}} · collecté le {{collected}}</p>
  <div class="detail-body">
    {{body}}
  </div>
  <div class="detail-actions">
    <a class="button" href="{{url}}" rel="noopener noreferrer"><svg class="icon"><use href="#i-arrow"></use></svg><span>Ouvrir la source originale</span></a>
    {{favorite}}
  </div>
</article>
